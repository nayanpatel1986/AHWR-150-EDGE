# Example OPC UA input (demo: the opc-plc simulator). Not loaded by default.
# To use it, copy into telegraf.d/. Its metrics flow through the same telemetry
# mapping as PLC data (stored as opcua_demo.<field>). Read-only collection.
[[inputs.opcua]]
  name_override = "opcua_demo"
  endpoint = "opc.tcp://opc-plc:50000"
  connect_timeout = "15s"
  request_timeout = "10s"
  security_policy = "None"
  security_mode = "None"
  auth_method = "Anonymous"
  [[inputs.opcua.group]]
    namespace = "3"
    identifier_type = "s"
    [[inputs.opcua.group.nodes]]
      name = "fast_counter"
      identifier = "FastUInt1"
    [[inputs.opcua.group.nodes]]
      name = "slow_counter"
      identifier = "SlowUInt1"
    [[inputs.opcua.group.nodes]]
      name = "random_uint"
      identifier = "RandomUnsignedInt32"
    [[inputs.opcua.group.nodes]]
      name = "spike"
      identifier = "SpikeData"
    [[inputs.opcua.group.nodes]]
      name = "dip"
      identifier = "DipData"
