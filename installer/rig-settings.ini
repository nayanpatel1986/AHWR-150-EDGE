; AHWR-150 EDGE - rig settings. The only file you fill in (Notepad is fine).
; Replace every <...> value, save, then run Install.bat.
; Lines starting with ; are comments. After a successful install the installer
; moves DeviceToken and the passwords into its protected settings and blanks
; them here. Later changes: edit C:\AHWR\config\rig-settings.ini, then run
; C:\AHWR\tools\Apply-Settings.bat.

[Rig]
; exactly as in the asset list, e.g. AHWR-50-III; never change it later
DeviceId = <rig name>
Asset = <asset, e.g. Ankleshwar>
; drive for the database, records, logs and backups (C: on a single-disk test PC)
DataDrive = D:

[Network]
; only machines in these subnets can open the HMI (comma-separated)
RigLanSubnet = <rig LAN subnet, e.g. 10.20.30.0/24>
; checked for reachability; the S7 address is also written into the standard tag map
PlcAddress = <PLC IP address, e.g. 192.168.0.11>
; S7 or Modbus
PlcProtocol = S7

[CMF]
CentralUrl = https://crmf.ongc.local
; from the CMF administrator; may be left blank and added later
DeviceToken =
; optional: the CMF ETP v1.2 server (needs DeviceToken), e.g. wss://crmf.ongc.local:8443
EtpUrl =

[Domain]
; yes = AD accounts can sign in (the local admin keeps working); no = local accounts only
Enabled = no
DomainController = ldaps://<domain controller>:636
Domain = <asset domain>
BindAccount = <LDAP service account DN>
BindPassword =
SearchBase = <DC=...,DC=...>
AdminGroup = <AD group for admins>
OperatorGroup = <AD group for operators>
; optional; anyone else who signs in gets the viewer role
ViewerGroup =

[BOP]
; KEPServerEX OPC UA endpoint read by the BOP collector
KepwareUrl = opc.tcp://localhost:49320
KepwareUser =
KepwarePassword =

[Install]
; strict: stop if the PC is below the required hardware; relaxed: warn only (test PCs)
Checks = strict
