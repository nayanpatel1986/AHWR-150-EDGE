[global_tags]
  user = "telegraf"

[agent]
  interval = "1s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "1s"
  flush_jitter = "0s"
  precision = ""
  hostname = ""
  omit_hostname = false

# Output: InfluxDB v2 (token/org/bucket injected from the environment).
[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]
  token = "$INFLUX_TOKEN"
  organization = "$INFLUX_ORG"
  bucket = "$INFLUX_BUCKET"

# Lightweight heartbeat input so Telegraf always has a valid input and stays
# up even before any PLC is configured. (Measurements 'internal_*' are ignored
# by the backend.) Run Telegraf with --watch-config=poll so edits below reload.
[[inputs.internal]]
  collect_memstats = false

# Keep stroke count compatible with the existing InfluxDB field schema.
# Older data stored this field as float; S7 DI/DW reads arrive as integer.
[[processors.converter]]
  [processors.converter.fields]
    float = ["Mud Pumps Totals Strokes-Count", "Mud Pumps Total Strokes-Count"]

# =============================================================================
# RIG PLC ACCESS: READ-ONLY COLLECTION
# inputs.s7comm reads configured addresses; it does not write PLC values.
# CMD/Start/Stop-named fields are read-back observations, not commands.
# outputs.influxdb_v2 writes measurements to the historian, not the PLC.
# Telegraf 1.29.5 s7comm has no read_only setting; do not add an unsupported flag.
# This note documents plugin behavior, not a PLC/network access-control rule.
# DEVICE / PLC inputs below are MANAGED BY THE BACKEND (admin -> PLC config UI).
# Telegraf is started with --watch-config and hot-reloads when this is rewritten.
# Do not hand-edit between the markers.
# =============================================================================
